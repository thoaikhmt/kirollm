[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kirollm"
version = "1.0.0"
description = "Python and LangChain client for Kiro's streaming LLM API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "thoaikhmt" },
]
keywords = [
    "kiro",
    "llm",
    "langchain",
    "langgraph",
    "streaming",
    "ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "requests==2.34.2",
]

[project.urls]
Homepage = "https://github.com/thoaikhmt/kirollm"
Repository = "https://github.com/thoaikhmt/kirollm"
Issues = "https://github.com/thoaikhmt/kirollm/issues"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "langchain-core==1.6.3",
    "langgraph==1.0.10",
    "langgraph-prebuilt==1.0.8",
    "ruff==0.13.2",
    "pyright==1.1.406",
]
langchain = ["langchain-core==1.6.3"]
langgraph = [
    "langchain-core==1.6.3",
    "langgraph==1.0.10",
    "langgraph-prebuilt==1.0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that call a live Kiro model",
]
